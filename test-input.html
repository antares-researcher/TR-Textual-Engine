<!DOCTYPE html>
<html>
<head>
    <title>Teste de Input Manual</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-area { 
            border: 2px solid #ccc; 
            padding: 20px; 
            margin: 20px 0;
            min-height: 200px;
            background: #f9f9f9;
        }
        .focused { border-color: #3498db; background: #f0f8ff; }
        button { margin: 5px; padding: 8px 16px; }
    </style>
</head>
<body>
    <h1>Teste de Input Manual - Trevia Editor</h1>
    
    <div>
        <button onclick="testBasicTyping()">Teste Digitação Básica</button>
        <button onclick="testCopyPaste()">Teste Copiar/Colar</button>
        <button onclick="testSpecialChars()">Teste Caracteres Especiais</button>
        <button onclick="clearEditor()">Limpar</button>
    </div>
    
    <div id="test-area" class="test-area" tabindex="0">
        Carregando...
    </div>
    
    <div id="info">
        <p><strong>Status:</strong> <span id="status">Inicializando...</span></p>
        <p><strong>Texto:</strong> <span id="current-text">-</span></p>
        <p><strong>Cursor:</strong> <span id="cursor-pos">-</span></p>
    </div>

    <script type="module">
        import init, { TreviaEditor } from './pkg/trevia_editor_engine.js';

        let editor = null;
        let testArea = null;

        async function initTest() {
            try {
                await init();
                editor = new TreviaEditor(400, 600);
                editor.set_margins(20, 20, 20, 20);
                
                testArea = document.getElementById('test-area');
                setupEvents();
                
                document.getElementById('status').textContent = 'Pronto! Clique na área e digite';
                updateInfo();
                
            } catch (error) {
                document.getElementById('status').textContent = 'Erro: ' + error.message;
            }
        }

        function setupEvents() {
            testArea.addEventListener('click', () => {
                testArea.focus();
                testArea.classList.add('focused');
            });
            
            testArea.addEventListener('blur', () => {
                testArea.classList.remove('focused');
            });
            
            testArea.addEventListener('keydown', (e) => {
                if (!editor) return;
                
                e.preventDefault();
                
                switch (e.key) {
                    case 'Backspace':
                        editor.delete_text(1);
                        break;
                    case 'Enter':
                        editor.insert_text('\\n');
                        break;
                    case 'ArrowLeft':
                        editor.move_cursor_by(-1);
                        break;
                    case 'ArrowRight':
                        editor.move_cursor_by(1);
                        break;
                    default:
                        if (e.key.length === 1) {
                            editor.insert_text(e.key);
                        }
                        break;
                }
                
                updateInfo();
            });
            
            testArea.addEventListener('paste', (e) => {
                if (!editor) return;
                
                e.preventDefault();
                const text = (e.clipboardData || window.clipboardData).getData('text');
                if (text) {
                    editor.insert_text(text);
                    updateInfo();
                }
            });
        }

        function updateInfo() {
            if (!editor) return;
            
            const text = editor.get_document_text();
            const cursor = editor.get_cursor_position();
            
            document.getElementById('current-text').textContent = 
                text.length > 50 ? text.substring(0, 50) + '...' : text;
            document.getElementById('cursor-pos').textContent = 
                `Offset: ${cursor.offset}, Página: ${cursor.page}`;
        }

        function testBasicTyping() {
            if (!editor) return;
            editor.insert_text('Teste de digitação básica. ');
            updateInfo();
        }

        function testCopyPaste() {
            if (!editor) return;
            const testText = 'Texto copiado e colado com sucesso! ';
            editor.insert_text(testText);
            updateInfo();
        }

        function testSpecialChars() {
            if (!editor) return;
            editor.insert_text('Chars especiais: áéíóú âêîôû ção ñ ¡¿ €£¥ ');
            updateInfo();
        }

        function clearEditor() {
            if (!editor) return;
            const length = editor.get_document_length();
            if (length > 0) {
                editor.set_selection(0, length);
                editor.delete_selection();
            }
            updateInfo();
        }

        window.testBasicTyping = testBasicTyping;
        window.testCopyPaste = testCopyPaste;
        window.testSpecialChars = testSpecialChars;
        window.clearEditor = clearEditor;

        initTest();
    </script>
</body>
</html>
